[project]
name = "coc-farming-2"
version = "0.1.0"
description = "Phased Clash of Clans farming over USB ADB with loot OCR and multi-template attacks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.3,<13",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10,<1",
    "easyocr>=1.7,<2",
]

[project.scripts]
coc-farm2 = "coc_farm2.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "types-pillow>=10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coc_farm2"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["coc_farm2"]
mypy_path = "src"
